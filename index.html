<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIMIKA | Boutique Store Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-serif { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="bg-[#FDFBF7] text-stone-800 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const firebaseConfig = {
      apiKey: "AIzaSyDBizHM3e0uV5FDwipQuYXphM-4YpPF5sQ",
      authDomain: "dimika.firebaseapp.com",
      projectId: "dimika",
      storageBucket: "dimika.firebasestorage.app",
      messagingSenderId: "174515280340",
      appId: "1:174515280340:web:ba840b54829780e84c9e41"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    const { useState, useEffect } = React;

    function App() {
      const [user, setUser] = useState(null);
      const [loadingAuth, setLoadingAuth] = useState(true);
      const [emailInput, setEmailInput] = useState('');
      const [passInput, setPassInput] = useState('');
      const [loginError, setLoginError] = useState('');
      const [products, setProducts] = useState([]);
      const [salesHistory, setSalesHistory] = useState([]);

      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
          setLoadingAuth(false);
        });
        return () => unsubscribe();
      }, []);

      const handleLogin = async (e) => {
        e.preventDefault();
        setLoginError('');
        try {
          await auth.signInWithEmailAndPassword(emailInput, passInput);
        } catch (err) {
          setLoginError('Correo o contraseña incorrectos.');
        }
      };

      const handleLogout = () => auth.signOut();

      useEffect(() => {
        if (!user) return;
        const unsubProducts = db.collection('products').onSnapshot(snapshot => {
          const items = [];
          snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
          setProducts(items);
        });
        const unsubSales = db.collection('sales').onSnapshot(snapshot => {
          const items = [];
          snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
          setSalesHistory(items);
        });
        return () => { unsubProducts(); unsubSales(); };
      }, [user]);

      const exportFullBackupToCSV = () => {
        let csvContent = "=== BACKUP GENERAL DIMIKA ===\n\n";
        csvContent += "--- INVENTARIO ---\nID,Nombre,Costo Flores,Precio Venta,Color,Talle,Stock\n";
        products.forEach(p => {
          (p.variants || []).forEach(v => {
            csvContent += `"${p.id}","${p.name}",${p.costFlores},${p.finalPrice || 0},"${v.color}","${v.size}",${v.quantity}\n`;
          });
        });
        const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `DIMIKA_Backup_${new Date().toISOString().slice(0, 10)}.csv`;
        link.click();
      };

      if (loadingAuth) return <div className="min-h-screen flex items-center justify-center text-xs">Cargando DIMIKA...</div>;

      if (!user) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-[#FDFBF7] p-4">
            <div className="w-full max-w-sm bg-white border border-stone-200 rounded-3xl p-8 shadow-xl space-y-6">
              <div className="text-center space-y-2">
                <div className="w-12 h-12 bg-amber-900 rounded-2xl flex items-center justify-center text-amber-100 font-bold text-xl mx-auto">D</div>
                <h2 className="text-2xl font-serif font-bold text-stone-900">DIMIKA</h2>
                <p className="text-xs text-stone-500">Acceso Privado para Socias</p>
              </div>
              <form onSubmit={handleLogin} className="space-y-4 text-xs">
                {loginError && <div className="p-3 bg-rose-50 text-rose-700 text-center rounded-xl font-medium">{loginError}</div>}
                <div>
                  <label className="block text-stone-700 font-medium mb-1">Correo Electrónico</label>
                  <input type="email" required placeholder="tu-email@gmail.com" value={emailInput} onChange={e => setEmailInput(e.target.value)} className="w-full h-11 px-3 bg-stone-50 border rounded-xl" />
                </div>
                <div>
                  <label className="block text-stone-700 font-medium mb-1">Contraseña</label>
                  <input type="password" required placeholder="••••••••" value={passInput} onChange={e => setPassInput(e.target.value)} className="w-full h-11 px-3 bg-stone-50 border rounded-xl" />
                </div>
                <button type="submit" className="w-full h-11 rounded-xl bg-amber-900 text-white font-bold text-xs">Iniciar Sesión</button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen pb-12">
          <header className="bg-white border-b border-stone-200 sticky top-0 z-30 shadow-xs">
            <div className="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-amber-900 flex items-center justify-center text-amber-100 font-bold text-lg">D</div>
                <div>
                  <h1 className="text-xl font-serif font-bold text-stone-900">DIMIKA</h1>
                  <p className="text-xs text-stone-500">{user.email}</p>
                </div>
              </div>
              <div className="flex items-center gap-2">
                <button onClick={exportFullBackupToCSV} className="px-3 py-2 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 font-bold text-xs">📥 Backup Excel</button>
                <button onClick={handleLogout} className="px-3 py-2 rounded-xl bg-stone-100 text-stone-600 font-bold text-xs">Salir</button>
              </div>
            </div>
          </header>
          <main className="max-w-7xl mx-auto px-4 py-6">
            <p className="text-xs text-stone-600">¡Sesión iniciada con éxito! Toda la mercadería y ventas se sincronizan en vivo.</p>
          </main>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
