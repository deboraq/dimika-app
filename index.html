<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIMIKA | Boutique Store Manager</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel compiler for inline JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-serif { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="bg-[#FDFBF7] text-stone-800 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    // --- CONFIGURACIÓN FIREBASE DIMIKA ---
    const firebaseConfig = {
      apiKey: "AIzaSyDBizHM3e0uV5FDwipQuYXphM-4YpPF5sQ",
      authDomain: "dimika.firebaseapp.com",
      projectId: "dimika",
      storageBucket: "dimika.firebasestorage.app",
      messagingSenderId: "174515280340",
      appId: "1:174515280340:web:ba840b54829780e84c9e41"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    const { useState, useEffect, useMemo, useRef } = React;

    const DEFAULT_CATEGORIES = [
      'Vestidos de fiesta',
      'Sastrería',
      'Tops / Blusas',
      'Pantalones / Faldas',
      'Accesorios'
    ];

    const DEFAULT_COLORS = [
      { id: 'c-1', name: 'Blanco', hex: '#FFFFFF' },
      { id: 'c-2', name: 'Negro', hex: '#1C1917' },
      { id: 'c-3', name: 'Lila', hex: '#C084FC' },
      { id: 'c-4', name: 'Rosa / Chicle', hex: '#F472B6' },
      { id: 'c-5', name: 'Fucsia', hex: '#E11D48' },
      { id: 'c-6', name: 'Rojo', hex: '#DC2626' },
      { id: 'c-7', name: 'Dorado / Champagne', hex: '#D97706' },
      { id: 'c-8', name: 'Plata', hex: '#9CA3AF' },
      { id: 'c-9', name: 'Verde / Esmeralda', hex: '#059669' },
      { id: 'c-10', name: 'Azul Noche', hex: '#1E3A8A' },
      { id: 'c-11', name: 'Nude / Manteca', hex: '#E5E0D8' },
      { id: 'c-12', name: 'Marrón / Chocolate', hex: '#78350F' }
    ];

    const DEFAULT_EXPENSES = [
      { id: 'exp-1', concept: 'Pasaje colectivo Córdoba - Flores (Ida/Vuelta)', amount: 110000, category: 'Viaje', notes: 'Servicio semicama' },
      { id: 'exp-2', concept: 'Bultos de consorcio en colectivo', amount: 20000, category: 'Transporte', notes: 'Bolsas reforzadas' },
      { id: 'exp-3', concept: 'Viáticos y comida del día', amount: 30000, category: 'Comida', notes: 'Almuerzo y café' }
    ];

    function App() {
      const [user, setUser] = useState(null);
      const [loadingAuth, setLoadingAuth] = useState(true);

      const [emailInput, setEmailInput] = useState('');
      const [passInput, setPassInput] = useState('');
      const [loginError, setLoginError] = useState('');

      const [products, setProducts] = useState([]);
      const [expenses, setExpenses] = useState(DEFAULT_EXPENSES);
      const [salesHistory, setSalesHistory] = useState([]);
      const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
      const [customColors, setCustomColors] = useState(DEFAULT_COLORS);

      const [globalLogisticsPct, setGlobalLogisticsPct] = useState(25.0);
      const [isManualLogisticsOverride, setIsManualLogisticsOverride] = useState(false);

      const [activeTab, setActiveTab] = useState('dashboard');
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [selectedStatus, setSelectedStatus] = useState('All');
      const [expandedStockRows, setExpandedStockRows] = useState({});

      // Modals
      const [isProductModalOpen, setIsProductModalOpen] = useState(false);
      const [editingProduct, setEditingProduct] = useState(null);
      const [isExpenseModalOpen, setIsExpenseModalOpen] = useState(false);
      const [editingExpense, setEditingExpense] = useState(null);
      const [isSellModalOpen, setIsSellModalOpen] = useState(false);
      const [activeSellProduct, setActiveSellProduct] = useState(null);
      const [editingSale, setEditingSale] = useState(null);
      const [selectedSellVariantIndex, setSelectedSellVariantIndex] = useState(0);
      const [isShareModalOpen, setIsShareModalOpen] = useState(false);
      const [activeShareProduct, setActiveShareProduct] = useState(null);
      const [copiedText, setCopiedText] = useState(false);
      const [isQuickStockModalOpen, setIsQuickStockModalOpen] = useState(false);
      const [activeStockProduct, setActiveStockProduct] = useState(null);
      const [stockMode, setStockMode] = useState('existing');
      const [quickStockVariantIdx, setQuickStockVariantIdx] = useState(0);
      const [quickAddQty, setQuickAddQty] = useState('1');
      const [newStockColor, setNewStockColor] = useState('Negro');
      const [newStockSize, setNewStockSize] = useState('M');

      // Forms
      const [prodForm, setProdForm] = useState({
        name: '',
        category: 'Vestidos de fiesta',
        costFlores: '',
        markupPct: '130',
        finalPrice: '',
        notes: '',
        variants: [{ color: 'Negro', size: 'M', quantity: 1 }]
      });

      const [expenseForm, setExpenseForm] = useState({ concept: '', amount: '', category: 'Viaje', notes: '' });
      const [sellForm, setSellForm] = useState({ quantityToSell: '1', salePrice: '', paymentMethod: 'Efectivo', notes: '' });
      const [newCategoryName, setNewCategoryName] = useState('');
      const [newColorForm, setNewColorForm] = useState({ name: '', hex: '#78350F' });

      const navContainerRef = useRef(null);
      const scrollNav = (dir) => {
        if (navContainerRef.current) {
          navContainerRef.current.scrollBy({ left: dir === 'left' ? -200 : 200, behavior: 'smooth' });
        }
      };

      // --- AUTH ---
      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
          setLoadingAuth(false);
        });
        return () => unsubscribe();
      }, []);

      const handleLogin = async (e) => {
        e.preventDefault();
        setLoginError('');
        try {
          await auth.signInWithEmailAndPassword(emailInput, passInput);
        } catch (err) {
          setLoginError('Correo o contraseña incorrectos.');
        }
      };

      const handleLogout = () => auth.signOut();

      // --- FIRESTORE LISTENERS ---
      useEffect(() => {
        if (!user) return;

        const unsubProducts = db.collection('products').onSnapshot(snap => {
          const list = [];
          snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
          setProducts(list);
        });

        const unsubExpenses = db.collection('expenses').onSnapshot(snap => {
          const list = [];
          snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
          if (list.length > 0) setExpenses(list);
        });

        const unsubSales = db.collection('sales').onSnapshot(snap => {
          const list = [];
          snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
          setSalesHistory(list.sort((a, b) => new Date(b.soldAt) - new Date(a.soldAt)));
        });

        const unsubConfig = db.collection('config').doc('settings').onSnapshot(doc => {
          if (doc.exists) {
            const data = doc.data();
            if (data.categories) setCategories(data.categories);
            if (data.customColors) setCustomColors(data.customColors);
            if (data.globalLogisticsPct !== undefined) setGlobalLogisticsPct(data.globalLogisticsPct);
          }
        });

        return () => {
          unsubProducts();
          unsubExpenses();
          unsubSales();
          unsubConfig();
        };
      }, [user]);

      const saveConfigToFirebase = async (newCats, newCols, newPct) => {
        try {
          await db.collection('config').doc('settings').set({
            categories: newCats || categories,
            customColors: newCols || customColors,
            globalLogisticsPct: newPct !== undefined ? newPct : globalLogisticsPct
          }, { merge: true });
        } catch (e) {
          console.error("Error config:", e);
        }
      };

      // --- CALCULATIONS ---
      const totalLogisticsCost = useMemo(() => expenses.reduce((acc, curr) => acc + (parseFloat(curr.amount) || 0), 0), [expenses]);
      const totalFloresCost = useMemo(() => {
        return products.reduce((acc, p) => {
          const units = (p.variants || []).reduce((sum, v) => sum + (parseInt(v.quantity) || 0), 0);
          return acc + ((parseFloat(p.costFlores) || 0) * units);
        }, 0);
      }, [products]);

      const calculatedLogisticsPct = useMemo(() => {
        if (totalFloresCost > 0 && totalLogisticsCost > 0) {
          return parseFloat(((totalLogisticsCost / totalFloresCost) * 100).toFixed(1));
        }
        return 25.0;
      }, [totalFloresCost, totalLogisticsCost]);

      useEffect(() => {
        if (!isManualLogisticsOverride) {
          setGlobalLogisticsPct(calculatedLogisticsPct);
        }
      }, [calculatedLogisticsPct, isManualLogisticsOverride]);

      const stats = useMemo(() => {
        const totalInvertedReal = totalFloresCost + totalLogisticsCost;
        const totalSalesRevenue = salesHistory.reduce((acc, s) => acc + (parseFloat(s.salePrice) * parseInt(s.quantitySold)), 0);
        const netProfitRealized = salesHistory.reduce((acc, s) => {
          const itemRealCost = (parseFloat(s.costFlores) || 0) * (1 + globalLogisticsPct / 100);
          const profitPerUnit = parseFloat(s.salePrice) - itemRealCost;
          return acc + (profitPerUnit * parseInt(s.quantitySold));
        }, 0);

        const totalUnitsInStock = products.reduce((acc, p) => acc + (p.variants || []).reduce((sum, v) => sum + (parseInt(v.quantity) || 0), 0), 0);
        const totalValuedStockPrice = products.reduce((acc, p) => {
          const units = (p.variants || []).reduce((sum, v) => sum + (parseInt(v.quantity) || 0), 0);
          return acc + ((parseFloat(p.finalPrice) || parseFloat(p.priceSuggested) || 0) * units);
        }, 0);

        const projectedProfit = totalValuedStockPrice + totalSalesRevenue - totalInvertedReal;

        return { totalInvertedReal, totalSalesRevenue, netProfitRealized, totalUnitsInStock, totalValuedStockPrice, projectedProfit };
      }, [products, expenses, salesHistory, totalFloresCost, totalLogisticsCost, globalLogisticsPct]);

      const analyticsData = useMemo(() => {
        const prodMap = {}, sizeMap = {}, colorMap = {}, catMap = {}, payMap = { 'Efectivo': 0, 'Transferencia Bancaria': 0, 'Tarjeta de Crédito': 0 };
        salesHistory.forEach(s => {
          const qty = parseInt(s.quantitySold) || 1;
          const rev = parseFloat(s.salePrice) * qty;
          if (!prodMap[s.productName]) prodMap[s.productName] = { name: s.productName, units: 0, revenue: 0 };
          prodMap[s.productName].units += qty;
          prodMap[s.productName].revenue += rev;

          sizeMap[s.size || 'Único'] = (sizeMap[s.size || 'Único'] || 0) + qty;
          colorMap[s.color || 'Varios'] = (colorMap[s.color || 'Varios'] || 0) + qty;
          catMap[s.category || 'Otros'] = (catMap[s.category || 'Otros'] || 0) + qty;
          payMap[s.paymentMethod || 'Efectivo'] = (payMap[s.paymentMethod || 'Efectivo'] || 0) + rev;
        });

        return {
          topProducts: Object.values(prodMap).sort((a,b) => b.units - a.units).slice(0, 5),
          sizeBreakdown: Object.entries(sizeMap).map(([size, units]) => ({ size, units })).sort((a,b) => b.units - a.units),
          colorBreakdown: Object.entries(colorMap).map(([color, units]) => ({ color, units })).sort((a,b) => b.units - a.units),
          categoryBreakdown: Object.entries(catMap).map(([category, units]) => ({ category, units })).sort((a,b) => b.units - a.units),
          paymentMap: payMap
        };
      }, [salesHistory]);

      const calculateCosts = (floresInput, markupInput) => {
        const flores = parseFloat(floresInput) || 0;
        const markup = parseFloat(markupInput) || 130;
        const costReal = Math.round(flores * (1 + globalLogisticsPct / 100));
        const suggested = Math.round(costReal * (1 + markup / 100));
        return { costReal, suggested };
      };

      const getProductStockTotal = (p) => (p.variants || []).reduce((sum, v) => sum + (parseInt(v.quantity) || 0), 0);
      const toggleRowExpansion = (id) => setExpandedStockRows(prev => ({ ...prev, [id]: !prev[id] }));

      const exportToCSV = (type) => {
        let csvContent = "";
        let fileName = "";
        if (type === 'products') {
          fileName = `DIMIKA_Inventario_${new Date().toISOString().slice(0, 10)}.csv`;
          csvContent = "ID,Nombre,Categoria,Costo Flores,Costo Real Cordoba,Precio Final,Notas,Color,Talle,Stock\n";
          products.forEach(p => {
            const realCba = Math.round((parseFloat(p.costFlores) || 0) * (1 + globalLogisticsPct / 100));
            (p.variants || []).forEach(v => {
              csvContent += `"${p.id}","${p.name}","${p.category}",${p.costFlores},${realCba},${p.finalPrice || p.priceSuggested},"${p.notes || ''}","${v.color}","${v.size}",${v.quantity}\n`;
            });
          });
        } else if (type === 'sales') {
          fileName = `DIMIKA_Ventas_${new Date().toISOString().slice(0, 10)}.csv`;
          csvContent = "Fecha,Prenda,Categoria,Color,Talle,Cantidad,Precio Venta,Medio Pago,Notas\n";
          salesHistory.forEach(s => {
            csvContent += `"${new Date(s.soldAt).toLocaleDateString('es-AR')}","${s.productName}","${s.category}","${s.color}","${s.size}",${s.quantitySold},${s.salePrice},"${s.paymentMethod}","${s.notes || ''}"\n`;
          });
        } else if (type === 'expenses') {
          fileName = `DIMIKA_Gastos_${new Date().toISOString().slice(0, 10)}.csv`;
          csvContent = "Concepto,Rubro,Importe,Notas\n";
          expenses.forEach(e => {
            csvContent += `"${e.concept}","${e.category}",${e.amount},"${e.notes || ''}"\n`;
          });
        }

        const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = fileName;
        link.click();
      };

      const filteredProducts = useMemo(() => {
        return products.filter(p => {
          const searchMatch = p.name?.toLowerCase().includes(searchTerm.toLowerCase()) || p.category?.toLowerCase().includes(searchTerm.toLowerCase());
          const catMatch = selectedCategory === 'All' || p.category === selectedCategory;
          const totalStock = getProductStockTotal(p);
          let stockMatch = true;
          if (activeTab === 'stock_only') stockMatch = totalStock > 0;
          else if (selectedStatus === 'available') stockMatch = totalStock > 0;
          else if (selectedStatus === 'sold_out') stockMatch = totalStock === 0;
          return searchMatch && catMatch && stockMatch;
        });
      }, [products, searchTerm, selectedCategory, selectedStatus, activeTab]);

      // Handlers para Prendas
      const openProductModal = (prod = null) => {
        if (prod) {
          setEditingProduct(prod);
          setProdForm({
            name: prod.name,
            category: prod.category || categories[0],
            costFlores: String(prod.costFlores),
            markupPct: String(prod.markupPct || 130),
            finalPrice: String(prod.finalPrice || prod.priceSuggested),
            notes: prod.notes || '',
            variants: prod.variants || [{ color: 'Negro', size: 'M', quantity: 1 }]
          });
        } else {
          setEditingProduct(null);
          setProdForm({
            name: '',
            category: categories[0] || 'Vestidos de fiesta',
            costFlores: '',
            markupPct: '130',
            finalPrice: '',
            notes: '',
            variants: [{ color: customColors[0]?.name || 'Negro', size: 'M', quantity: 1 }]
          });
        }
        setIsProductModalOpen(true);
      };

      const handleSaveProduct = async (e) => {
        e.preventDefault();
        if (!prodForm.name || !prodForm.costFlores) return;
        const floresNum = parseFloat(prodForm.costFlores);
        const markupNum = parseFloat(prodForm.markupPct) || 130;
        const { costReal, suggested } = calculateCosts(floresNum, markupNum);
        const finalPriceNum = prodForm.finalPrice !== '' ? parseFloat(prodForm.finalPrice) : suggested;

        const itemData = {
          name: prodForm.name,
          category: prodForm.category,
          costFlores: floresNum,
          markupPct: markupNum,
          priceSuggested: suggested,
          finalPrice: finalPriceNum,
          notes: prodForm.notes || '',
          variants: prodForm.variants.map(v => ({ color: v.color, size: v.size, quantity: parseInt(v.quantity) || 0 }))
        };

        if (editingProduct) {
          await db.collection('products').doc(editingProduct.id).update(itemData);
        } else {
          await db.collection('products').add(itemData);
        }
        setIsProductModalOpen(false);
      };

      const handleDeleteProduct = async (id) => {
        if (confirm("¿Estás segura de eliminar esta prenda?")) {
          await db.collection('products').doc(id).delete();
        }
      };

      const openQuickStockModal = (product) => {
        setActiveStockProduct(product);
        setStockMode('existing');
        setQuickStockVariantIdx(0);
        setQuickAddQty('1');
        setIsQuickStockModalOpen(true);
      };

      const handleConfirmQuickStock = async (e) => {
        e.preventDefault();
        if (!activeStockProduct) return;
        const qty = parseInt(quickAddQty) || 0;
        let updatedVariants = [];
        if (stockMode === 'existing') {
          updatedVariants = activeStockProduct.variants.map((v, i) => i === quickStockVariantIdx ? { ...v, quantity: v.quantity + qty } : v);
        } else {
          updatedVariants = [...activeStockProduct.variants, { color: newStockColor, size: newStockSize, quantity: qty }];
        }
        await db.collection('products').doc(activeStockProduct.id).update({ variants: updatedVariants });
        setIsQuickStockModalOpen(false);
      };

      // --- FUNCIONES DE VENTAS (REGISTRAR, EDITAR Y ELIMINAR CON DEVOLUCIÓN DE STOCK) ---
      const handleConfirmSale = async (e) => {
        e.preventDefault();
        if (!activeSellProduct) return;

        const qtyToSell = parseInt(sellForm.quantityToSell) || 1;
        const salePriceNum = parseFloat(sellForm.salePrice) || activeSellProduct.finalPrice;
        const flores = parseFloat(activeSellProduct.costFlores) || 0;
        const realCostCba = Math.round(flores * (1 + globalLogisticsPct / 100));

        if (editingSale) {
          // Edición de venta existente
          const oldQty = parseInt(editingSale.quantitySold) || 0;
          const qtyDiff = qtyToSell - oldQty; // Positivo si vendió más, negativo si vendió menos

          const updatedVariants = activeSellProduct.variants.map(v => {
            if (v.color === editingSale.color && v.size === editingSale.size) {
              return { ...v, quantity: v.quantity - qtyDiff };
            }
            return v;
          });

          await db.collection('products').doc(activeSellProduct.id).update({ variants: updatedVariants });
          await db.collection('sales').doc(editingSale.id).update({
            quantitySold: qtyToSell,
            salePrice: salePriceNum,
            netProfitUnit: salePriceNum - realCostCba,
            paymentMethod: sellForm.paymentMethod,
            notes: sellForm.notes
          });

          setEditingSale(null);
        } else {
          // Venta Nueva
          const variant = activeSellProduct.variants[selectedSellVariantIndex];
          const updatedVariants = activeSellProduct.variants.map((v, i) => i === selectedSellVariantIndex ? { ...v, quantity: v.quantity - qtyToSell } : v);

          await db.collection('products').doc(activeSellProduct.id).update({ variants: updatedVariants });
          await db.collection('sales').add({
            productId: activeSellProduct.id,
            productName: activeSellProduct.name,
            category: activeSellProduct.category,
            color: variant.color,
            size: variant.size,
            quantitySold: qtyToSell,
            salePrice: salePriceNum,
            costFlores: flores,
            netProfitUnit: salePriceNum - realCostCba,
            paymentMethod: sellForm.paymentMethod,
            notes: sellForm.notes,
            soldAt: new Date().toISOString()
          });
        }

        setIsSellModalOpen(false);
      };

      const openEditSaleModal = (sale) => {
        const prod = products.find(p => p.id === sale.productId || p.name === sale.productName);
        if (!prod) {
          alert("No se encontró la prenda asociada en el inventario.");
          return;
        }
        setEditingSale(sale);
        setActiveSellProduct(prod);
        setSellForm({
          quantityToSell: String(sale.quantitySold),
          salePrice: String(sale.salePrice),
          paymentMethod: sale.paymentMethod || 'Efectivo',
          notes: sale.notes || ''
        });
        setIsSellModalOpen(true);
      };

      const handleDeleteSale = async (sale) => {
        if (!confirm(`¿Eliminar la venta de "${sale.productName}" (${sale.quantitySold}u.)? El stock se devolverá automáticamente al inventario.`)) return;

        try {
          const prod = products.find(p => p.id === sale.productId || p.name === sale.productName);
          if (prod) {
            const updatedVariants = (prod.variants || []).map(v => {
              if (v.color === sale.color && v.size === sale.size) {
                return { ...v, quantity: (parseInt(v.quantity) || 0) + parseInt(sale.quantitySold) };
              }
              return v;
            });
            await db.collection('products').doc(prod.id).update({ variants: updatedVariants });
          }
          await db.collection('sales').doc(sale.id).delete();
        } catch (err) {
          console.error("Error al eliminar venta:", err);
        }
      };

      const openExpenseModal = (exp = null) => {
        if (exp) {
          setEditingExpense(exp);
          setExpenseForm({ concept: exp.concept, amount: String(exp.amount), category: exp.category, notes: exp.notes || '' });
        } else {
          setEditingExpense(null);
          setExpenseForm({ concept: '', amount: '', category: 'Viaje', notes: '' });
        }
        setIsExpenseModalOpen(true);
      };

      const handleSaveExpense = async (e) => {
        e.preventDefault();
        const data = { concept: expenseForm.concept, amount: parseFloat(expenseForm.amount), category: expenseForm.category, notes: expenseForm.notes };
        if (editingExpense) {
          await db.collection('expenses').doc(editingExpense.id).update(data);
        } else {
          await db.collection('expenses').add(data);
        }
        setIsExpenseModalOpen(false);
      };

      const handleDeleteExpense = async (id) => {
        await db.collection('expenses').doc(id).delete();
      };

      const getWhatsAppMessage = (product) => {
        if (!product) return '';
        const vars = (product.variants || []).filter(v => v.quantity > 0).map(v => `• ${v.color} (Talle: ${v.size})`).join('\n');
        return `✨ *DIMIKA | Boutique Fiesta (Córdoba)* ✨\n\n👗 *${product.name}*\n🏷️ Categoría: ${product.category}\n💵 *Precio: $${(product.finalPrice || product.priceSuggested).toLocaleString('es-AR')}*\n\n🎨 *Colores y Talles Disponibles:*\n${vars || 'Consultar'}\n\n📲 ¡Escribinos para reservar la tuya! 🛍️`;
      };

      if (loadingAuth) return <div className="min-h-screen flex items-center justify-center text-xs text-stone-500">Cargando DIMIKA...</div>;

      if (!user) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-[#FDFBF7] p-4">

                <div>
                  <h3 className="font-bold text-stone-900 text-sm mb-3">🎨 Colores</h3>
                  <form onSubmit={e => { e.preventDefault(); if(newColorForm.name){ const nc = [...customColors, {id:'c-'+Date.now(), ...newColorForm}]; setCustomColors(nc); setNewColorForm({name:'', hex:'#78350F'}); saveConfigToFirebase(null, nc, globalLogisticsPct); }}} className="flex gap-2 mb-3">
                    <input type="color" value={newColorForm.hex} onChange={e => setNewColorForm({...newColorForm, hex: e.target.value})} className="w-9 h-9" />
                    <input type="text" placeholder="Nombre color" value={newColorForm.name} onChange={e => setNewColorForm({...newColorForm, name: e.target.value})} className="flex-1 h-9 px-3 border rounded-xl" />
                    <button type="submit" className="px-3 bg-amber-900 text-white rounded-xl font-bold">Agregar</button>
                  </form>
                  <div className="space-y-1">
                    {customColors.map(c => (
                      <div key={c.id} className="p-2 bg-stone-50 border rounded flex justify-between items-center"><span className="flex items-center gap-2"><span className="w-3 h-3 rounded-full border" style={{backgroundColor: c.hex}}></span>{c.name}</span> <button onClick={() => { const ncl = customColors.filter(x=>x.id!==c.id); setCustomColors(ncl); saveConfigToFirebase(null, ncl, globalLogisticsPct); }}>❌</button></div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* MODAL: CARGAR / EDITAR PRENDA */}
          {isProductModalOpen && (
            <div className="fixed inset-0 bg-stone-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-6 w-full max-w-lg space-y-4 shadow-xl max-h-[90vh] overflow-y-auto text-xs">
                <h3 className="font-bold text-stone-900 text-sm">{editingProduct ? 'Editar Prenda' : 'Cargar Nueva Prenda'}</h3>
                <form onSubmit={handleSaveProduct} className="space-y-3">
                  <input type="text" placeholder="Nombre Prenda" required value={prodForm.name} onChange={e => setProdForm({...prodForm, name: e.target.value})} className="w-full h-11 px-3 border rounded-xl" />
                  <select value={prodForm.category} onChange={e => setProdForm({...prodForm, category: e.target.value})} className="w-full h-11 px-3 border rounded-xl">
                    {categories.map((c, i) => <option key={i} value={c}>{c}</option>)}
                  </select>
                  <div className="grid grid-cols-2 gap-2">
                    <input type="number" placeholder="Costo Flores ($)" required value={prodForm.costFlores} onChange={e => {
                      const val = e.target.value;
                      const { suggested } = calculateCosts(val, prodForm.markupPct);
                      setProdForm({...prodForm, costFlores: val, finalPrice: String(suggested)});
                    }} className="w-full h-11 px-3 border rounded-xl" />
                    <input type="number" placeholder="Precio Venta ($)" value={prodForm.finalPrice} onChange={e => setProdForm({...prodForm, finalPrice: e.target.value})} className="w-full h-11 px-3 border rounded-xl font-bold text-amber-900" />
                  </div>
                  <input type="text" placeholder="Notas opcionales (ej: Tela de gasa, sin elastizar)" value={prodForm.notes} onChange={e => setProdForm({...prodForm, notes: e.target.value})} className="w-full h-11 px-3 border rounded-xl" />

                  <div className="p-3 bg-stone-50 border rounded-xl space-y-2">
                    <div className="flex justify-between items-center">
                      <span className="font-semibold text-stone-700">Variantes (Colores / Talles / Stock)</span>
                      <button type="button" onClick={() => setProdForm(prev => ({...prev, variants: [...prev.variants, {color: customColors[0]?.name || 'Negro', size: 'M', quantity: 1}]}))} className="text-amber-900 font-bold">+ Fila</button>
                    </div>
                    {prodForm.variants.map((v, idx) => (
                      <div key={idx} className="flex gap-2">
                        <select value={v.color} onChange={e => { const u=[...prodForm.variants]; u[idx].color=e.target.value; setProdForm({...prodForm, variants:u}); }} className="w-1/3 h-9 px-2 border rounded-lg">
                          {customColors.map(c => <option key={c.id} value={c.name}>{c.name}</option>)}
                        </select>
                        <input type="text" placeholder="Talle" value={v.size} onChange={e => { const u=[...prodForm.variants]; u[idx].size=e.target.value; setProdForm({...prodForm, variants:u}); }} className="w-1/3 h-9 px-2 border rounded-lg text-center" />
                        <input type="number" placeholder="Cant" value={v.quantity} onChange={e => { const u=[...prodForm.variants]; u[idx].quantity=e.target.value; setProdForm({...prodForm, variants:u}); }} className="w-1/3 h-9 px-2 border rounded-lg font-bold text-center" />
                      </div>
                    ))}
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setIsProductModalOpen(false)} className="px-4 py-2 rounded-xl bg-stone-100">Cancelar</button>
                    <button type="submit" className="px-4 py-2 rounded-xl bg-amber-900 text-white font-bold">Guardar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: QUICK STOCK */}
          {isQuickStockModalOpen && activeStockProduct && (
            <div className="fixed inset-0 bg-stone-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-6 w-full max-w-md space-y-4 shadow-xl text-xs">
                <h3 className="font-bold text-stone-900 text-sm">Reponer / Agregar Stock</h3>
                <div className="flex p-1 bg-stone-100 rounded-xl">
                  <button type="button" onClick={() => setStockMode('existing')} className={`flex-1 py-1.5 rounded-lg ${stockMode==='existing'?'bg-amber-900 text-white':''}`}>Reponer existente</button>
                  <button type="button" onClick={() => setStockMode('new_variant')} className={`flex-1 py-1.5 rounded-lg ${stockMode==='new_variant'?'bg-amber-900 text-white':''}`}>Nuevo color/talle</button>
                </div>
                <form onSubmit={handleConfirmQuickStock} className="space-y-3">
                  {stockMode === 'existing' ? (
                    <select value={quickStockVariantIdx} onChange={e => setQuickStockVariantIdx(parseInt(e.target.value))} className="w-full h-11 px-3 border rounded-xl">
                      {(activeStockProduct.variants || []).map((v, i) => (
                        <option key={i} value={i}>{v.color} ({v.size}) - Actual: {v.quantity}</option>
                      ))}
                    </select>
                  ) : (
                    <div className="grid grid-cols-2 gap-2">
                      <select value={newStockColor} onChange={e => setNewStockColor(e.target.value)} className="h-11 px-3 border rounded-xl">
                        {customColors.map(c => <option key={c.id} value={c.name}>{c.name}</option>)}
                      </select>
                      <input type="text" placeholder="Talle" value={newStockSize} onChange={e => setNewStockSize(e.target.value)} className="h-11 px-3 border rounded-xl text-center" />
                    </div>
                  )}
                  <input type="number" placeholder="Cantidad a sumar" min="1" required value={quickAddQty} onChange={e => setQuickAddQty(e.target.value)} className="w-full h-11 px-3 border rounded-xl font-bold" />
                  <div className="flex justify-end gap-2">
                    <button type="button" onClick={() => setIsQuickStockModalOpen(false)} className="px-4 py-2 bg-stone-100 rounded-xl">Cancelar</button>
                    <button type="submit" className="px-4 py-2 bg-amber-900 text-white font-bold rounded-xl">Guardar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: GASTO */}
          {isExpenseModalOpen && (
            <div className="fixed inset-0 bg-stone-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-6 w-full max-w-md space-y-4 shadow-xl text-xs">
                <h3 className="font-bold text-stone-900 text-sm">Cargar Gasto de Viaje</h3>
                <form onSubmit={handleSaveExpense} className="space-y-3">
                  <input type="text" placeholder="Concepto (ej: Pasajes)" required value={expenseForm.concept} onChange={e => setExpenseForm({...expenseForm, concept: e.target.value})} className="w-full h-11 px-3 border rounded-xl" />
                  <input type="number" placeholder="Importe ($)" required value={expenseForm.amount} onChange={e => setExpenseForm({...expenseForm, amount: e.target.value})} className="w-full h-11 px-3 border rounded-xl font-bold text-amber-900" />
                  <input type="text" placeholder="Notas (opcional)" value={expenseForm.notes} onChange={e => setExpenseForm({...expenseForm, notes: e.target.value})} className="w-full h-11 px-3 border rounded-xl" />
                  <div className="flex justify-end gap-2">
                    <button type="button" onClick={() => setIsExpenseModalOpen(false)} className="px-4 py-2 rounded-xl bg-stone-100">Cancelar</button>
                    <button type="submit" className="px-4 py-2 rounded-xl bg-amber-900 text-white font-bold">Guardar Gasto</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: VENTA / EDITAR VENTA */}
          {isSellModalOpen && activeSellProduct && (
            <div className="fixed inset-0 bg-stone-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-6 w-full max-w-md space-y-4 shadow-xl text-xs">
                <h3 className="font-bold text-stone-900 text-sm">{editingSale ? `Editar Venta de "${editingSale.productName}"` : 'Registrar Venta'}</h3>
                <form onSubmit={handleConfirmSale} className="space-y-3">
                  {!editingSale && (
                    <select value={selectedSellVariantIndex} onChange={e => setSelectedSellVariantIndex(parseInt(e.target.value))} className="w-full h-11 px-3 border rounded-xl">
                      {(activeSellProduct.variants || []).map((v, i) => (
                        <option key={i} value={i} disabled={v.quantity <= 0}>
                          {v.color} ({v.size}) - {v.quantity} u. disponibles
                        </option>
                      ))}
                    </select>
                  )}
                  {editingSale && (
                    <div className="p-3 bg-stone-50 rounded-xl border">
                      Variante: <strong>{editingSale.color} ({editingSale.size})</strong>
                    </div>
                  )}
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-stone-500 mb-1">Cantidad</label>
                      <input type="number" min="1" required value={sellForm.quantityToSell} onChange={e => setSellForm({...sellForm, quantityToSell: e.target.value})} className="w-full h-11 px-3 border rounded-xl font-bold" />
                    </div>
                    <div>
                      <label className="block text-stone-500 mb-1">Precio Unitario ($)</label>
                      <input type="number" placeholder="Precio Venta ($)" required value={sellForm.salePrice} onChange={e => setSellForm({...sellForm, salePrice: e.target.value})} className="w-full h-11 px-3 border rounded-xl font-bold text-emerald-800" />
                    </div>
                  </div>
                  <select value={sellForm.paymentMethod} onChange={e => setSellForm({...sellForm, paymentMethod: e.target.value})} className="w-full h-11 px-3 border rounded-xl">
                    <option value="Efectivo">Efectivo</option>
                    <option value="Transferencia Bancaria">Transferencia Bancaria</option>
                    <option value="Tarjeta de Crédito">Tarjeta de Crédito</option>
                  </select>
                  <input type="text" placeholder="Notas de venta (opcional)" value={sellForm.notes} onChange={e => setSellForm({...sellForm, notes: e.target.value})} className="w-full h-11 px-3 border rounded-xl" />
                  <div className="flex justify-end gap-2">
                    <button type="button" onClick={() => setIsSellModalOpen(false)} className="px-4 py-2 rounded-xl bg-stone-100">Cancelar</button>
                    <button type="submit" className="px-4 py-2 rounded-xl bg-emerald-700 text-white font-bold">{editingSale ? 'Guardar Cambios' : 'Confirmar Venta'}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: WHATSAPP */}
          {isShareModalOpen && activeShareProduct && (
            <div className="fixed inset-0 bg-stone-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-6 w-full max-w-md space-y-4 shadow-xl text-xs">
                <h3 className="font-bold text-stone-900 text-sm">Ficha para WhatsApp</h3>
                <div className="p-3 bg-stone-50 border rounded-xl font-mono text-[11px] whitespace-pre-wrap select-all">
                  {getWhatsAppMessage(activeShareProduct)}
                </div>
                <div className="flex justify-between items-center">
                  <button onClick={() => setIsShareModalOpen(false)} className="px-4 py-2 rounded-xl bg-stone-100">Cerrar</button>
                  <button onClick={() => { navigator.clipboard.writeText(getWhatsAppMessage(activeShareProduct)); setCopiedText(true); setTimeout(() => setCopiedText(false), 2000); }} className="px-4 py-2 rounded-xl bg-amber-900 text-white font-bold">
                    {copiedText ? '¡Copiado!' : 'Copiar Texto'}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
