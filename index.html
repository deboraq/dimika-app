<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIMIKA | Boutique Store Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-serif { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="bg-[#FDFBF7] text-stone-800 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const firebaseConfig = {
      apiKey: "AIzaSyDBizHM3e0uV5FDwipQuYXphM-4YpPF5sQ",
      authDomain: "dimika.firebaseapp.com",
      projectId: "dimika",
      storageBucket: "dimika.firebasestorage.app",
      messagingSenderId: "174515280340",
      appId: "1:174515280340:web:ba840b54829780e84c9e41"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    const { useState, useEffect, useMemo } = React;

    function App() {
      const [user, setUser] = useState(null);
      const [loadingAuth, setLoadingAuth] = useState(true);
      const [emailInput, setEmailInput] = useState('');
      const [passInput, setPassInput] = useState('');
      const [loginError, setLoginError] = useState('');

      const [products, setProducts] = useState([]);
      const [salesHistory, setSalesHistory] = useState([]);
      const [activeTab, setActiveTab] = useState('inventory');
      const [searchTerm, setSearchTerm] = useState('');

      const [isProductModalOpen, setIsProductModalOpen] = useState(false);
      const [isSellModalOpen, setIsSellModalOpen] = useState(false);
      const [activeSellProduct, setActiveSellProduct] = useState(null);
      const [selectedSellVariantIndex, setSelectedSellVariantIndex] = useState(0);

      const [prodForm, setProdForm] = useState({
        name: '',
        category: 'Vestidos de fiesta',
        costFlores: '',
        finalPrice: '',
        variants: [{ color: 'Blanco', size: 'M', quantity: 1 }]
      });

      const [sellForm, setSellForm] = useState({
        quantityToSell: '1',
        salePrice: ''
      });

      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
          setLoadingAuth(false);
        });
        return () => unsubscribe();
      }, []);

      const handleLogin = async (e) => {
        e.preventDefault();
        setLoginError('');
        try {
          await auth.signInWithEmailAndPassword(emailInput, passInput);
        } catch (err) {
          setLoginError('Correo o contraseña incorrectos.');
        }
      };

      const handleLogout = () => auth.signOut();

      useEffect(() => {
        if (!user) return;
        const unsubProducts = db.collection('products').onSnapshot(snapshot => {
          const items = [];
          snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
          setProducts(items);
        });
        const unsubSales = db.collection('sales').onSnapshot(snapshot => {
          const items = [];
          snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
          setSalesHistory(items.sort((a, b) => new Date(b.soldAt) - new Date(a.soldAt)));
        });
        return () => { unsubProducts(); unsubSales(); };
      }, [user]);

      const exportFullBackupToCSV = () => {
        let csvContent = "=== BACKUP GENERAL DIMIKA ===\n\n";
        csvContent += "--- INVENTARIO ---\nID,Nombre,Categoria,Costo Flores,Precio Venta,Color,Talle,Stock\n";
        products.forEach(p => {
          (p.variants || []).forEach(v => {
            csvContent += `"${p.id}","${p.name}","${p.category || 'General'}",${p.costFlores},${p.finalPrice || 0},"${v.color}","${v.size}",${v.quantity}\n`;
          });
        });
        csvContent += "\n--- HISTORIAL DE VENTAS ---\nFecha,Producto,Color,Talle,Cantidad,Precio Venta Unitario\n";
        salesHistory.forEach(s => {
          csvContent += `"${new Date(s.soldAt).toLocaleString('es-AR')}","${s.productName}","${s.color}","${s.size}",${s.quantitySold},${s.salePrice}\n`;
        });

        const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `DIMIKA_Backup_${new Date().toISOString().slice(0, 10)}.csv`;
        link.click();
      };

      const getProductStockTotal = (p) => {
        return (p.variants || []).reduce((sum, v) => sum + (parseInt(v.quantity) || 0), 0);
      };

      const handleSaveProduct = async (e) => {
        e.preventDefault();
        if (!prodForm.name || !prodForm.costFlores) return;
        const floresNum = parseFloat(prodForm.costFlores);
        const finalPriceNum = parseFloat(prodForm.finalPrice) || Math.round(floresNum * 2.3);

        const itemData = {
          name: prodForm.name,
          category: prodForm.category,
          costFlores: floresNum,
          finalPrice: finalPriceNum,
          variants: prodForm.variants.map(v => ({
            color: v.color,
            size: v.size,
            quantity: parseInt(v.quantity) || 0
          }))
        };

        await db.collection('products').add(itemData);
        setIsProductModalOpen(false);
        setProdForm({ name: '', category: 'Vestidos de fiesta', costFlores: '', finalPrice: '', variants: [{ color: 'Blanco', size: 'M', quantity: 1 }] });
      };

      const handleConfirmSale = async (e) => {
        e.preventDefault();
        if (!activeSellProduct) return;
        const variant = activeSellProduct.variants[selectedSellVariantIndex];
        const qtyToSell = parseInt(sellForm.quantityToSell) || 1;

        const updatedVariants = activeSellProduct.variants.map((v, i) => {
          if (i === selectedSellVariantIndex) return { ...v, quantity: v.quantity - qtyToSell };
          return v;
        });

        await db.collection('products').doc(activeSellProduct.id).update({ variants: updatedVariants });
        await db.collection('sales').add({
          productName: activeSellProduct.name,
          color: variant.color,
          size: variant.size,
          quantitySold: qtyToSell,
          salePrice: parseFloat(sellForm.salePrice),
          soldAt: new Date().toISOString()
        });

        setIsSellModalOpen(false);
      };

      const addVariantRow = () => {
        setProdForm(prev => ({ ...prev, variants: [...prev.variants, { color: 'Blanco', size: 'M', quantity: 1 }] }));
      };

      const updateVariantRow = (index, field, value) => {
        setProdForm(prev => {
          const updated = [...prev.variants];
          updated[index] = { ...updated[index], [field]: value };
          return { ...prev, variants: updated };
        });
      };

      const filteredProducts = useMemo(() => {
        return products.filter(p => p.name?.toLowerCase().includes(searchTerm.toLowerCase()));
      }, [products, searchTerm]);

      if (loadingAuth) return <div className="min-h-screen flex items-center justify-center text-xs text-stone-500">Cargando DIMIKA...</div>;

      if (!user) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-[#FDFBF7] p-4">
            <div className="w-full max-w-sm bg-white border border-stone-200 rounded-3xl p-8 shadow-xl space-y-6">
              <div className="text-center space-y-2">
                <div className="w-12 h-12 bg-amber-900 rounded-2xl flex items-center justify-center text-amber-100 font-bold text-xl mx-auto shadow-md">D</div>
                <h2 className="text-2xl font-serif font-bold text-stone-900">DIMIKA</h2>
                <p className="text-xs text-stone-500">Acceso Privado para Socias</p>
              </div>
              <form onSubmit={handleLogin} className="space-y-4 text-xs">
                {loginError && <div className="p-3 bg-rose-50 text-rose-700 text-center rounded-xl font-medium border border-rose-200">{loginError}</div>}
                <div>
                  <label className="block text-stone-700 font-medium mb-1">Correo Electrónico</label>
                  <input type="email" required placeholder="tu-email@gmail.com" value={emailInput} onChange={e => setEmailInput(e.target.value)} className="w-full h-11 px-3 bg-stone-50 border rounded-xl focus:outline-none focus:border-amber-900" />
                </div>
                <div>
                  <label className="block text-stone-700 font-medium mb-1">Contraseña</label>
                  <input type="password" required placeholder="••••••••" value={passInput} onChange={e => setPassInput(e.target.value)} className="w-full h-11 px-3 bg-stone-50 border rounded-xl focus:outline-none focus:border-amber-900" />
                </div>
                <button type="submit" className="w-full h-11 rounded-xl bg-amber-900 hover:bg-amber-800 text-white font-bold text-xs transition-all shadow-md">Iniciar Sesión</button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen pb-12">
          {/* Header */}
          <header className="bg-white border-b border-stone-200 sticky top-0 z-30 shadow-xs">
            <div className="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-amber-900 flex items-center justify-center text-amber-100 font-bold text-lg shadow-sm">D</div>
                <div>
                  <h1 className="text-xl font-serif font-bold text-stone-900">DIMIKA</h1>
                  <p className="text-xs text-stone-500">{user.email}</p>
                </div>
              </div>
              <div className="flex items-center gap-2">
                <button onClick={exportFullBackupToCSV} className="px-3 py-2 rounded-xl bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-800 font-bold text-xs transition-colors">📥 Backup Excel</button>
                <button onClick={() => setIsProductModalOpen(true)} className="px-4 py-2 rounded-xl bg-amber-900 hover:bg-amber-800 text-white font-bold text-xs shadow-sm">+ Cargar Prenda</button>
                <button onClick={handleLogout} className="px-3 py-2 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-600 font-bold text-xs transition-colors">Salir</button>
              </div>
            </div>
          </header>

          {/* Main Content */}
          <main className="max-w-7xl mx-auto px-4 py-6 space-y-4">
            <div className="flex justify-between items-center flex-wrap gap-3">
              <div className="flex space-x-2 border-b border-stone-200 pb-2">
                <button onClick={() => setActiveTab('inventory')} className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${activeTab === 'inventory' ? 'bg-amber-900 text-white' : 'bg-stone-100 text-stone-700'}`}>
                  Inventario ({products.length})
                </button>
                <button onClick={() => setActiveTab('sales')} className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${activeTab === 'sales' ? 'bg-amber-900 text-white' : 'bg-stone-100 text-stone-700'}`}>
                  Ventas ({salesHistory.length})
                </button>
              </div>

              {activeTab === 'inventory' && (
                <input 
                  type="text" 
                  placeholder="Buscar prenda..." 
                  value={searchTerm} 
                  onChange={e => setSearchTerm(e.target.value)}
                  className="h-9 px-3 bg-white border rounded-xl text-xs w-full sm:w-64"
                />
              )}
            </div>

            {/* Inventory Table */}
            {activeTab === 'inventory' && (
              <div className="bg-white border border-stone-200 rounded-2xl overflow-hidden shadow-sm">
                <table className="w-full text-left text-xs">
                  <thead>
                    <tr className="border-b bg-[#F9F6F0] text-stone-600 font-medium">
                      <th className="py-3 px-4">Prenda / Categoría</th>
                      <th className="py-3 px-3">Variantes & Talles</th>
                      <th className="py-3 px-3 text-center">Stock Total</th>
                      <th className="py-3 px-3">Costo Flores</th>
                      <th className="py-3 px-3 text-amber-900 font-bold">Precio Venta</th>
                      <th className="py-3 px-4 text-right">Acción</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-stone-100">
                    {filteredProducts.length === 0 ? (
                      <tr><td colSpan="6" className="py-10 text-center text-stone-400">No hay prendas guardadas. Tocá <strong>"+ Cargar Prenda"</strong> arriba para empezar.</td></tr>
                    ) : (
                      filteredProducts.map(product => {
                        const totalStock = getProductStockTotal(product);
                        return (
                          <tr key={product.id} className="h-14 hover:bg-amber-50/30 transition-colors">
                            <td className="py-3 px-4">
                              <div className="font-semibold text-stone-900">{product.name}</div>
                              <div className="text-[10px] text-stone-400">{product.category}</div>
                            </td>
                            <td className="py-3 px-3">
                              <div className="flex flex-wrap gap-1">
                                {(product.variants || []).map((v, i) => (
                                  <span key={i} className={`px-2 py-0.5 rounded-full border text-[11px] ${v.quantity <= 0 ? 'bg-stone-100 text-stone-400 line-through' : 'bg-stone-50 text-stone-800'}`}>
                                    {v.color} ({v.size}): <strong className="font-mono">{v.quantity}u</strong>
                                  </span>
                                ))}
                              </div>
                            </td>
                            <td className="py-3 px-3 text-center font-mono font-bold text-stone-800">{totalStock} u.</td>
                            <td className="py-3 px-3 font-mono text-stone-600">${product.costFlores}</td>
                            <td className="py-3 px-3 font-mono font-bold text-amber-900">${product.finalPrice}</td>
                            <td className="py-3 px-4 text-right">
                              {totalStock > 0 && (
                                <button onClick={() => { setActiveSellProduct(product); setSellForm({ quantityToSell: '1', salePrice: String(product.finalPrice) }); setIsSellModalOpen(true); }} className="px-3 py-1.5 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white font-bold transition-all">
                                  Vender
                                </button>
                              )}
                            </td>
                          </tr>
                        );
                      })
                    )}
                  </tbody>
                </table>
              </div>
            )}

            {/* Sales Table */}
            {activeTab === 'sales' && (
              <div className="bg-white border border-stone-200 rounded-2xl overflow-hidden shadow-sm">
                <table className="w-full text-left text-xs">
                  <thead>
                    <tr className="border-b bg-[#F9F6F0] text-stone-600 font-medium">
                      <th className="py-3 px-4">Fecha</th>
                      <th className="py-3 px-3">Prenda</th>
                      <th className="py-3 px-3">Variante</th>
                      <th className="py-3 px-3 text-center">Cant.</th>
                      <th className="py-3 px-4 text-right">Total Cobrado</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-stone-100">
                    {salesHistory.length === 0 ? (
                      <tr><td colSpan="5" className="py-10 text-center text-stone-400">Aún no registraste ventas.</td></tr>
                    ) : (
                      salesHistory.map((s, idx) => (
                        <tr key={idx} className="h-12 hover:bg-stone-50">
                          <td className="py-3 px-4 font-mono text-stone-500">{new Date(s.soldAt).toLocaleDateString('es-AR')}</td>
                          <td className="py-3 px-3 font-semibold text-stone-800">{s.productName}</td>
                          <td className="py-3 px-3">{s.color} ({s.size})</td>
                          <td className="py-3 px-3 text-center font-mono font-bold">{s.quantitySold}</td>
                          <td className="py-3 px-4 text-right font-mono font-bold text-emerald-800">${(parseFloat(s.salePrice) * parseInt(s.quantitySold)).toLocaleString('es-AR')}</td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            )}
          </main>

          {/* Modal Cargar Prenda */}
          {isProductModalOpen && (
            <div className="fixed inset-0 bg-stone-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-6 w-full max-w-md space-y-4 shadow-xl">
                <h3 className="font-bold text-stone-900">Cargar Nueva Prenda</h3>
                <form onSubmit={handleSaveProduct} className="space-y-3 text-xs">
                  <input type="text" placeholder="Nombre Prenda (ej: Vestido Lurex)" required value={prodForm.name} onChange={e => setProdForm({...prodForm, name: e.target.value})} className="w-full h-11 px-3 border rounded-xl" />
                  <div className="grid grid-cols-2 gap-2">
                    <input type="number" placeholder="Costo Flores ($)" required value={prodForm.costFlores} onChange={e => setProdForm({...prodForm, costFlores: e.target.value})} className="w-full h-11 px-3 border rounded-xl" />
                    <input type="number" placeholder="Precio Venta ($)" value={prodForm.finalPrice} onChange={e => setProdForm({...prodForm, finalPrice: e.target.value})} className="w-full h-11 px-3 border rounded-xl font-bold text-amber-900" />
                  </div>
                  
                  <div className="p-3 bg-stone-50 border rounded-xl space-y-2">
                    <div className="flex justify-between items-center">
                      <span className="font-semibold text-stone-700">Variantes (Colores/Talles)</span>
                      <button type="button" onClick={addVariantRow} className="text-amber-900 font-bold">+ Fila</button>
                    </div>
                    {prodForm.variants.map((v, idx) => (
                      <div key={idx} className="flex gap-2">
                        <input type="text" placeholder="Color" value={v.color} onChange={e => updateVariantRow(idx, 'color', e.target.value)} className="w-1/3 h-9 px-2 border rounded-lg" />
                        <input type="text" placeholder="Talle" value={v.size} onChange={e => updateVariantRow(idx, 'size', e.target.value)} className="w-1/3 h-9 px-2 border rounded-lg text-center" />
                        <input type="number" placeholder="Cant" value={v.quantity} onChange={e => updateVariantRow(idx, 'quantity', e.target.value)} className="w-1/3 h-9 px-2 border rounded-lg font-bold text-center" />
                      </div>
                    ))}
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setIsProductModalOpen(false)} className="px-4 py-2 rounded-xl bg-stone-100">Cancelar</button>
                    <button type="submit" className="px-4 py-2 rounded-xl bg-amber-900 text-white font-bold">Guardar Prenda</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal Venta */}
          {isSellModalOpen && activeSellProduct && (
            <div className="fixed inset-0 bg-stone-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-6 w-full max-w-md space-y-4 shadow-xl">
                <h3 className="font-bold text-stone-900">Registrar Venta</h3>
                <form onSubmit={handleConfirmSale} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-stone-600 mb-1">Color y Talle a vender:</label>
                    <select value={selectedSellVariantIndex} onChange={e => setSelectedSellVariantIndex(parseInt(e.target.value))} className="w-full h-11 px-3 border rounded-xl">
                      {(activeSellProduct.variants || []).map((v, i) => (
                        <option key={i} value={i} disabled={v.quantity <= 0}>
                          {v.color} ({v.size}) - {v.quantity} u. disponibles
                        </option>
                      ))}
                    </select>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <input type="number" min="1" placeholder="Cantidad" required value={sellForm.quantityToSell} onChange={e => setSellForm({...sellForm, quantityToSell: e.target.value})} className="w-full h-11 px-3 border rounded-xl" />
                    <input type="number" placeholder="Precio Venta Unitario" required value={sellForm.salePrice} onChange={e => setSellForm({...sellForm, salePrice: e.target.value})} className="w-full h-11 px-3 border rounded-xl font-bold text-emerald-800" />
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setIsSellModalOpen(false)} className="px-4 py-2 rounded-xl bg-stone-100">Cancelar</button>
                    <button type="submit" className="px-4 py-2 rounded-xl bg-emerald-700 text-white font-bold">Confirmar Venta</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
